name: build-all

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      # Unsigned debug build for now — no Android keystore exists yet.
      # Once one does, switch to `assembleRelease` with signing config
      # populated from repo secrets.
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # ios/ can't be generated on the Windows dev machine this project was
      # scaffolded on (expo prebuild skips iOS entirely outside macOS/Linux),
      # so this job generates it fresh every run instead of relying on a
      # committed folder.
      - run: npx expo prebuild --platform ios
      - run: cd ios && pod install
      # Unsigned Simulator build — no Apple Developer account configured
      # yet, so this can't produce a real device / TestFlight / App Store
      # .ipa. Once that account + certs/profiles exist, switch the -sdk to
      # iphoneos and add code-signing secrets.
      # Workspace/scheme names are discovered at runtime rather than hardcoded —
      # expo prebuild sanitizes the app name (strips hyphens) when naming the
      # Xcode project, so "mobile-app" becomes "mobileapp".
      - run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: frontend/build/Build/Products/Release-iphonesimulator

  ios-device:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - run: cd ios && pod install
      # Real-device (arm64) build, deliberately left unsigned since there's
      # no Apple Developer account/certs in this repo. Sign it afterwards
      # with a free Apple ID via Sideloadly or AltServer (both run on
      # Windows/Linux, no Mac needed) to install on a physical iPhone —
      # the app expires after 7 days and needs re-signing, same limitation
      # Xcode's own free "personal team" signing has.
      - run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - run: |
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          mv *.app Payload/
          zip -r ../../../../unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: frontend/unsigned.ipa

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: pod install --project-directory=macos
      # Unsigned .app — no Apple Developer ID cert configured yet, so
      # Gatekeeper will block this on other machines until it's notarized.
      - run: |
          xcodebuild -workspace macos/mobile-app.xcworkspace -scheme mobile-app-macOS \
            -configuration Release CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: frontend/macos/build/Release/*.app

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # windows-latest runners ship VS2022 Build Tools with the C++ desktop
      # workload preinstalled, and pwsh is present by default. The Windows App
      # SDK 10.0.22621.0 that @react-native-async-storage/async-storage's
      # Windows project hardcodes isn't preinstalled on the runner though, so
      # it's installed explicitly here (MSB8036 otherwise).
      - uses: GuillaumeFalourd/setup-windows10-sdk-action@v2
        with:
          sdk-version: 22621
      - run: npx react-native run-windows --release --arch x64 --no-launch --no-deploy
      - uses: actions/upload-artifact@v4
        with:
          name: windows-appx
          path: frontend/windows/**/AppPackages/**/*.msix

  release:
    needs: [android, ios, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apk/*
            ios-simulator-build/*
            macos-app/*
            windows-appx/*
